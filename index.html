<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020603">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X">
<link rel="manifest" href="manifest.webmanifest">
<title>X • Personal Command Center</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020603;color:#49ff7b;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,monospace}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);background:radial-gradient(circle at 50% 15%,#0a2814,#020603 48%,#000)}
.app{max-width:1050px;margin:auto}.panel{background:rgba(2,11,5,.95);border:1px solid #176d31;border-radius:16px;box-shadow:0 0 22px rgba(73,255,123,.18),inset 0 0 22px rgba(73,255,123,.04)}
header{margin-top:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:34px;letter-spacing:7px;text-shadow:0 0 16px #49ff7b}.online{font-size:10px}.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#49ff7b;box-shadow:0 0 12px #49ff7b}
.grid{display:grid;grid-template-columns:175px 1fr 220px;gap:12px;margin-top:12px}.nav,.side{padding:11px}.nav button,.action{width:100%;margin:4px 0;padding:12px;border-radius:9px;border:1px solid #145f2b;background:#06160a;color:#49ff7b;text-align:left}.nav button:active,.action:active{transform:scale(.98)}
.core{min-height:400px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.orb{width:205px;height:205px;border:2px solid #49ff7b;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 35px #126a2e,inset 0 0 35px #073b17;position:relative}.orb:before{content:"";position:absolute;inset:18px;border:1px dashed #168c38;border-radius:50%}.orb:after{content:"";position:absolute;inset:-15px;border:1px solid #126a2e;border-top-color:#49ff7b;border-radius:50%;animation:spin 7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.xmark{font-size:58px;font-weight:900;text-shadow:0 0 20px #49ff7b}.output{margin-top:20px;min-height:62px;line-height:1.6;color:#b8ebc5}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.cards .panel{padding:14px}.metric{font-size:25px;margin:8px 0}.muted{font-size:11px;color:#79a987}.meter{height:7px;background:#09200f;border-radius:10px;overflow:hidden;margin:7px 0 12px}.meter i{display:block;height:100%;background:#49ff7b;box-shadow:0 0 9px #49ff7b}
.command{display:flex;gap:8px;padding:10px;margin-top:12px}.command input{flex:1;min-width:0;padding:14px;background:#010502;color:#49ff7b;border:1px solid #176d31;border-radius:10px;outline:none}.command button{padding:0 16px;border:0;border-radius:10px;background:#49ff7b;color:#001006;font-weight:900}.log{padding:12px;margin-top:12px;min-height:55px;font-size:12px}.boot{position:fixed;inset:0;background:#010402;display:grid;place-items:center;z-index:5;transition:opacity .7s}.bootBox{text-align:center}.bootTitle{font-size:72px;font-weight:900;letter-spacing:12px;text-shadow:0 0 25px #49ff7b}.bootLine{margin-top:14px;font-size:11px;color:#8fdca2}.hide{opacity:0;pointer-events:none}
@media(max-width:800px){.grid{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}.nav button{margin:0}.cards{grid-template-columns:1fr}.core{min-height:370px}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="bootBox"><div class="bootTitle">X</div><div class="bootLine" id="bootLine">INITIALIZING...</div></div></div>
<div class="app">
<header class="panel"><div class="logo">X</div><div class="online"><span class="led"></span> SYSTEM ONLINE</div></header>
<div class="grid">
<nav class="panel nav">
<button data-msg="Dashboard active.">◉ DASHBOARD</button>
<button data-msg="Investor mode engaged.">▣ INVESTOR</button>
<button data-msg="Email module ready. Connect a supported email service for real actions.">✉ EMAIL</button>
<button data-msg="Calendar module ready.">□ CALENDAR</button>
<button data-msg="Reminders module ready.">♢ REMINDERS</button>
<button data-msg="App center ready.">▦ APPS</button>
<button id="call">☎ CALL 🔒</button><button id="text">▤ TEXT 🔒</button>
</nav>
<main>
<section class="panel core"><div class="orb"><div class="xmark">X</div></div><div class="output" id="output">AWAITING COMMAND.</div></section>
<section class="cards">
<div class="panel"><b>X INVESTOR CORE</b><div class="metric">$10,000</div><div class="muted">SIMULATED PORTFOLIO</div><div class="meter"><i style="width:62%"></i></div><button class="action" data-msg="X Investor Simulator selected.">OPEN INVESTOR →</button></div>
<div class="panel"><b>SYSTEM MONITOR</b><p class="muted">NETWORK</p><div class="meter"><i style="width:91%"></i></div><p class="muted">SECURITY</p><div class="meter"><i style="width:100%"></i></div></div>
</section>
</main>
<aside class="panel side"><b>X ADVISOR</b><p class="muted">OWNER MINDSET</p><p>Ask what changed in the business, what you are paying, and what could make the thesis wrong.</p><button class="action" data-msg="Great company does not automatically mean great investment. Price matters.">INSIGHT</button></aside>
</div>
<div class="panel command"><input id="cmd" placeholder="Type: analyze NVDA" autocomplete="off"><button id="go">EXECUTE</button></div>
<div class="panel log" id="log">X LOG — system boot complete.</div>
</div>
<script>
const output=document.getElementById('output'),log=document.getElementById('log'),input=document.getElementById('cmd');
function say(s){output.innerHTML='<b>X:</b> '+s;log.textContent='X LOG — '+s}
function run(){const v=input.value.trim();if(!v){say('Please enter a command.');return}const x=v.toLowerCase();if(x.includes('nvda')||x.includes('invest'))say('Investor mode engaged. I can guide you through revenue, margins, EPS, P/E, cash flow, competition, risk, and valuation.');else if(x.includes('status'))say('All prototype systems are online.');else if(x.includes('help'))say('Try: analyze NVDA, investor mode, or system status.');else say('Command received: '+v);input.value='';input.focus()}
document.getElementById('go').onclick=run;input.onkeydown=e=>{if(e.key==='Enter')run()};
document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>say(b.dataset.msg));
document.getElementById('call').onclick=()=>{if(confirm('X: Confirm that you want to place this call?'))say('Confirmation received. No call was placed because this web app has no phone access.');else say('Call cancelled. No call was placed.')};
document.getElementById('text').onclick=()=>{if(confirm('X: Confirm that you want to send this text?'))say('Confirmation received. No text was sent because this web app has no messaging access.');else say('Text cancelled. No text was sent.')};
let lines=['INITIALIZING CORE','LOADING X PROTOCOLS','CHECKING SECURITY','SYSTEM READY'],n=0,t=setInterval(()=>{document.getElementById('bootLine').textContent=lines[n++];if(n===lines.length){clearInterval(t);setTimeout(()=>document.getElementById('boot').classList.add('hide'),500)}},550);
</script>
</body>
</html>
